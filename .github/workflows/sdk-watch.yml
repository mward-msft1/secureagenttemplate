name: SDK Version Watch

# Runs daily at 06:00 UTC and can be triggered manually.
# Checks PyPI for new versions of tracked SDKs, updates sdk-versions.json
# and docs/sdk-updates.md, then opens or updates a pull request.

on:
  schedule:
    - cron: "0 6 * * *"   # Daily at 06:00 UTC
  workflow_dispatch:        # Manual trigger via Actions UI

permissions:
  contents: write           # Push branch / commit files
  pull-requests: write      # Open / update the SDK update PR

jobs:
  check-sdk-updates:
    name: Check SDK versions on PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can create a branch off main
          fetch-depth: 0

      # ── Python setup ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install script dependencies
        run: pip install httpx

      # ── Run update checker ────────────────────────────────────────────────────
      - name: Check for SDK updates
        id: sdk_check
        # Exit code 1 means updates were found; exit 0 means no changes.
        # We capture the exit code and continue the job in both cases.
        run: |
          set +e
          python scripts/check_sdk_updates.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # ── Commit and open PR (only when updates were found) ─────────────────────
      - name: Configure git identity
        if: steps.sdk_check.outputs.exit_code == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or update SDK update branch
        if: steps.sdk_check.outputs.exit_code == '1'
        id: branch
        run: |
          BRANCH="chore/sdk-updates-$(date +%Y-%m-%d)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # If the branch already exists remotely, reset it to current HEAD
          git fetch origin "${BRANCH}" 2>/dev/null || true
          git checkout -B "${BRANCH}"

      - name: Commit SDK version changes
        if: steps.sdk_check.outputs.exit_code == '1'
        run: |
          git add sdk-versions.json docs/sdk-updates.md
          git commit -m "chore: update SDK versions $(date +%Y-%m-%d)"

      - name: Push branch
        if: steps.sdk_check.outputs.exit_code == '1'
        run: git push --force-with-lease origin "${{ steps.branch.outputs.branch }}"

      - name: Create or update pull request
        if: steps.sdk_check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          DATE=$(date +%Y-%m-%d)

          # Check whether a PR for this branch already exists
          EXISTING_PR=$(gh pr list \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING_PR}" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
            gh pr edit "${EXISTING_PR}" \
              --title "chore: SDK version updates ${DATE}" \
              --body "$(cat <<'EOF'
## SDK Version Updates

This PR was automatically generated by the **sdk-watch** workflow.

### What changed

The following SDK packages have new versions available on PyPI.
See [`sdk-versions.json`](sdk-versions.json) and
[`docs/sdk-updates.md`](docs/sdk-updates.md) for details.

### Before merging

- [ ] Review the linked PyPI changelogs for breaking changes.
- [ ] Update `requirements.txt` / `pyproject.toml` pin versions if needed.
- [ ] Run `pytest tests/ -v` to confirm no regressions.
EOF
)"
          else
            echo "Opening new PR for branch ${BRANCH}"
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore: SDK version updates ${DATE}" \
              --body "$(cat <<'EOF'
## SDK Version Updates

This PR was automatically generated by the **sdk-watch** workflow.

### What changed

The following SDK packages have new versions available on PyPI.
See [`sdk-versions.json`](sdk-versions.json) and
[`docs/sdk-updates.md`](docs/sdk-updates.md) for details.

### Before merging

- [ ] Review the linked PyPI changelogs for breaking changes.
- [ ] Update `requirements.txt` / `pyproject.toml` pin versions if needed.
- [ ] Run `pytest tests/ -v` to confirm no regressions.
EOF
)"
          fi

      # ── No-change summary ─────────────────────────────────────────────────────
      - name: No updates found
        if: steps.sdk_check.outputs.exit_code == '0'
        run: echo "All tracked SDKs are up-to-date. No PR needed."
